spring.application.name=nori

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nori}
spring.datasource.username=${DB_USER:nori}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Origins allowed to call the API from a browser (comma-separated); defaults to the Expo web dev server
nori.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}
